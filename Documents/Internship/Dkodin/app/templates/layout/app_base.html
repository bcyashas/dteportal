<!DOCTYPE html>
<html>
<head>
    <title>DKODIN Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: #1e293b;
            color: white;
            padding: 20px;
        }
        .sidebar a {
            color: #cbd5e1;
            display: block;
            margin: 10px 0;
            text-decoration: none;
        }
        .sidebar a:hover {
            color: white;
        }
        .main {
            margin-left: 260px;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 12px;
        }
        .card:hover {
    transform: scale(1.02);
    transition: 0.2s;
}

    </style>
</head>
<body>
<div class="sidebar">
    <h4>DKODIN</h4>
    <hr>
    <a href="/dashboard">Dashboard</a>
    <a href="/profile">Profile</a>
    <a href="/auth/logout">Logout</a>
</div>
<div class="main">
    {% block content %}{% endblock %}
</div>
<div class="d-flex justify-content-between mb-3">
    <h4>Dashboard</h4>
    <span>Welcome, {{ current_user.name }}</span>
</div>

</body>
</html>

{% extends "layout/app_base.html" %}
{% block content %}
<h3>My Profile</h3>
<div class="row mt-4">
    <!-- Profile Info -->
    <div class="col-md-4">
        <div class="card p-3 shadow-sm">
            <h5>Profile Info</h5>
            <hr>
            <p><strong>Name:</strong> {{ current_user.name }}</p>
            <p><strong>Email:</strong> {{ current_user.email }}</p>
            <p><strong>Phone:</strong> {{ current_user.phone or "Not Updated" }}</p>
        </div>
    </div>
    <!-- Update Form -->
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h5>Update Profile</h5>
            <hr>
            <form method="POST">
                <div class="mb-3">
                    <label>Name</label>
                    <input class="form-control" name="name" value="{{ current_user.name }}" required>
                </div>
                <div class="mb-3">
                    <label>Phone</label>
                    <input class="form-control" name="phone" value="{{ current_user.phone }}">
                </div>
                <button class="btn btn-primary">Update Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DTE RESULT PORTAL</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/resultwepage2.css') }}">
  </head>

  <body>
    <header>
      <img
        src="https://dtek.karnataka.gov.in/uploads/dept_logo1756810464.png"
        width="130px"
      />
      <h1>DEPARTMENT OF TECHNICAL EDUCATION</h1>
      <h2>DIPLOMA EXAMINATION RESULTS</h2>
    </header>
    <h2>DECEMBER–2025 EXAMINATION</h2>

    <div id="containar">
      <div id="info">
        <h3 id="Name"></h3>
        <h4 id="regno"></h4>
      </div>

      <table>
        <tr>
          <th>Subject</th>
          <th>Max Marks</th>
          <th>Marks Obtained</th>
        </tr>
        <tr>
          <td>Cyber Security Internal</td>
          <td>240</td>
          <td id="intermarks"></td>
        </tr>
        <tr>
          <td>Cyber Security Theory</td>
          <td>60</td>
          <td id="theorymarks"></td>
        </tr>
        <tr>
          <td>Cyber Security Practical</td>
          <td>100</td>
          <td id="practmarks"></td>
        </tr>
        <tr>
          <td style="font-weight: bold">Total</td>
          <td style="font-weight: bold">400</td>
          <td id="totalMarks" style="font-weight: bold"></td>
        </tr>
        <tr>
          <td></td>
          <td style="font-weight: bold">Grade</td>
          <td id="grade" style="font-weight: bold"></td>
        </tr>
        <tr>
          <td></td>
          <td style="font-weight: bold;">SGPA</td>
          <td id="sgpa" style="font-weight: bold;">
        </tr>
      </table>
    </div>
    <script src="{{ url_for('static', filename='js/resultwebpage.js') }}"></script>
  </body>
</html>
